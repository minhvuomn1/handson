tabs:
    fields:
        name:
            label: 'Họ tên'
            type: text
            span: auto
            tab: 'Thông tin chung'
        dob:
            label: 'Ngày sinh'
            type: datepicker
            mode: date
            span: auto
            tab: 'Thông tin chung'
        grade:
            label: Lớp
            type: number
            span: auto
            tab: 'Thông tin chung'
        generation:
            label: Khóa
            type: text
            span: auto
            tab: 'Thông tin chung'
        location:
            label: 'Khu vực'
            type: text
            span: auto
            tab: 'Thông tin chung'
        school:
            label: 'Trường học'
            type: relation
            nameFrom: name
            span: auto
            tab: 'Thông tin chung'
        sex:
            label: 'Giới tính'
            options:
                Nam: Nam
                Nữ: Nữ
            showSearch: true
            span: auto
            type: dropdown
            tab: 'Thông tin chung'
        family_manner:
            label: 'Hoàn cảnh gia đình'
            size: ''
            span: auto
            type: textarea
            tab: 'Thông tin chung'
        school_year:
            label: 'Năm học'
            span: auto
            type: text
            tab: 'Thông tin chung'
        avt:
            label: Ảnh đại diện
            type: fileupload
            mode: image
            imageWidth: 200
            imageHeight: 200
            fileTypes:
                - png
                - jpg
                - jpeg
            mimeTypes: 'png,jpg,jpeg'
            span: auto
            thumbOptions:
                mode: crop
                extension: auto
            tab: 'Thông tin chung'
