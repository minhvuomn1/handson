{% component 'HomeBanner' %}
<div class="dshb-page">

			<div class="banner-page">
				<div class="title-dshb">Danh sách học bổng</div>
			</div>
			<div class="filter-container">

					<select class="custom-dropdown">
					  <option value="">Chọn nhà tài trợ</option>
					  <option value="hands-on">Hands On</option>
					  <option value="viettel">Viettel</option>
					  <option value="vinschool">Vinschool</option>
					  <option value="other">Khác</option>
					</select>
				  </div>
				</div>
			  
				<!-- Dropdown: Trường -->
				<div class="input-search">
				  <div class="input-field">
					<div class="label-dropdown">Trường</div>

					  <option value="">Chọn trường</option>
					  <option value="ftu">ĐH Ngoại thương CSII</option>

					  <option value="">Chọn thế hệ</option>

					  <option value="f13">F13</option>
					  <option value="f14">F14</option>

				  <div class="input-field">

				<div class="button-filter-container">
