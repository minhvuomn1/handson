url = "quy-khuyen-hoc/danh-sach-hoc-bong" 
layout = "default" 
title = "Quỹ khuyến học - Danh sách học bổng" 
[HomeBanner] 
==  
{% put styles %}
	<link href="{{ 'assets/css/layouts/page/quy-khuyen-hoc/dshb.css'|theme }}" rel="stylesheet" />
{% endput %}
{% put scripts %}
	<script type="text/javascript" src="{{ 'assets/javascript/layouts/page/quy-khuyen-hoc/dshb.js'|theme }}"></script>
{% endput %}
{% component 'HomeBanner' %}

<div class="dshb-page">
	<div class="dshb-view">
		<div class="dshb-container">
			<div class="banner-page">
				<div class="title-dshb">Danh sách học bổng</div>
			</div>
			<div class="filter-container">
				<div class="auto-added-frame">
				  <svg class="action-icons-f-filter" width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
					<rect width="40" height="40" rx="20" fill="#999999" />
					<path d="M30.2462 9.84619H9.75385C9.10769 9.84619 8.73846 10.6308 9.15385 11.1385L18.1538 21.6154C18.4308 21.9385 18.6154 22.4 18.6154 22.8154V29.4616C18.6154 29.8308 18.9385 30.1539 19.3077 30.1539H20.6923C21.0615 30.1539 21.3846 29.8308 21.3846 29.4616V22.8154C21.3846 22.3539 21.5231 21.9385 21.8462 21.6154L30.8462 11.1385C31.2615 10.6308 30.9385 9.84619 30.2462 9.84619Z" fill="white"/>
				  </svg>
				</div>
			  
				<div class="label-filter">
				  <div class="link-text">Lọc theo</div>
				</div>
			  
				<!-- Dropdown: Nhà tài trợ học bổng -->
				<div class="input-search">
				  <div class="input-field">
					<div class="label-dropdown">Nhà tài trợ học bổng</div>
					<select id="filter-sponsor" class="custom-dropdown">
						<option value="">Chọn nhà tài trợ</option>
					</select>
				  </div>
				</div>
			  
				<!-- Dropdown: Trường -->
				<div class="input-search">
				  <div class="input-field">
					<div class="label-dropdown">Trường</div>
					<select id="filter-school" class="custom-dropdown">
						<option value="">Chọn trường</option>
					</select>
				  </div>
				</div>
			  
				<!-- Dropdown: Thế hệ -->
				<div class="input-search input-search2">
				  <div class="input-field">
					<div class="label-dropdown">Thế hệ</div>
					<select id="filter-generation" class="custom-dropdown">
					  <option value="">Chọn thế hệ</option>
					</select>
				  </div>
				</div>
			  
				<!-- Dropdown: Năm sinh -->
				<div class="input-search">
				  <div class="input-field">
					<div class="label-dropdown">Năm sinh</div>
					<select id="filter-dob" class="custom-dropdown">
					  <option value="">Chọn năm sinh</option>
					</select>
				  </div>
				</div>
			  
				<!-- Dropdown: Quê quán -->
				<div class="input-search">
				  <div class="input-field">
					<div class="label-dropdown">Quê quán</div>
					<select id="filter-location" class="custom-dropdown">
						<option value="">Chọn quê quán</option>
					</select>
				  </div>
				</div>
			  
				<!-- Nút lọc -->
				<div>
				  <button class="button-filter">Lọc</button>
				</div>
			  </div>
			  <!-- <div id="scholarship-list" class="scholarship-list"></div> -->
			 <!-- Ẩn template mẫu card -->
				<template id="student-card-template">
					<a class="student-card" href="#">
					<img src="" alt="Logo Hands On" class="logo" />
					<h3 class="student-name"></h3>
					<div class="student-school"></div>
					<div class="info"><strong>Khối</strong> <span class="info-value grade"></span></div>
					<div class="info"><strong>Năm sinh</strong> <span class="info-value dob"></span></div>
					<div class="info"><strong>Năm nhận học bổng</strong> <span class="info-value generation"></span></div>
					<div class="info"><strong>Khu vực</strong> <span class="info-value location"></span></div>
					<div class="info"><strong>Nhà tài trợ học bổng</strong> <span class="info-value sponsors"></span></div>
					<div class="scholarship-type"></div>
					</a>
				</template>
				
				
				<img id="logo-template" src="{{ 'assets/images/logo.png'|theme }}" style="display: none;" />
				
				<!-- Nơi hiển thị danh sách học bổng -->
				<div id="scholarship-list" class="scholarship-list"></div>
  
			  
		</div>

</div>
