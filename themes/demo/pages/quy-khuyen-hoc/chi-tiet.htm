url = "quy-khuyen-hoc/danh-sach-hoc-bong/chi-tiet" 
layout = "default" 
title = "Quỹ khuyến học - Danh sách học bổng" [HomeBanner] 
== 
{% put styles %}
<link
    href="{{ 'assets/css/layouts/page/quy-khuyen-hoc/dshb.css'|theme }}"
    rel="stylesheet"
/>
{% endput %} 
{% put scripts %}
<script
    type="text/javascript"
    src="{{ 'assets/javascript/layouts/page/quy-khuyen-hoc/dshb-details.js'|theme }}"
></script>
{% endput %} 
{% component 'HomeBanner' %}

<div class="dshb-page">
    <div class="dshb-view">
        <div class="dshb-container">
            <div class="banner-page">
                <div class="title-dshb">Danh sách học bổng</div>
            </div>
            <div class="container py-10" style="margin-top: 50px;">
              <div class="grid grid-cols-1 md:grid-cols-3 gap-8 container-chitiet" id="scholarshipDetailContainer">
                <!-- Nội dung sẽ render ở đây -->
              </div>
            </div>
            
            <!-- Template mẫu (ẩn) -->
            <template id="scholarship-template">
              <div class="row">
                <div class="main-image-container">
                  <img class="main-image" alt="Main Image">
                </div>
                <div class="gallery-images">
                  <!-- Các ảnh nhỏ sẽ được thêm vào đây thông qua JS -->
                </div>
              </div>
            
              <div class="col-span-2 space-y-6">
                <!-- Ảnh đại diện -->
                <div class="avatar-container">
                  <img class="student-avatar" alt="Student Avatar" style="width: 60px; height: 60px; border-radius: 50%;margin-bottom: 15px;">
                </div>
                <div>
                  <h2 class="text-2xl font-bold text-sky-600 student-name"></h2>
                  <p><strong>Trường:</strong> <span class="school-name"></span></p>
                  <p><strong>Khối:</strong> <span class="student-grade"></span></p>
                  <p><strong>Năm học:</strong> <span class="student-school-year"></span></p>
                  <p><strong>Quê quán:</strong> <span class="student-location"></span></p>
                  <p><strong>Nhà tài trợ học bổng:</strong> <span class="sponsor-name"></span></p>
                </div>
            
                <div>
                  <h3 class="font-bold text-lg">Thông tin cá nhân</h3>
                  <p><strong>Giới tính:</strong> <span class="student-sex"></span></p>
                  <p><strong>Ngày sinh:</strong> <span class="student-dob"></span></p>
                  <p><strong>Hoàn cảnh gia đình:</strong> <span class="student-family"></span></p>
                </div>
                <div>
                  <h3 class="font-bold text-lg">Kết quả học tập & hoạt động xã hội</h3>
                  <p><span class="result_activity"></span></p>
                 
                </div>
              </div>
              
            </div>
            </template>
            
        </div>
    </div>
</div>
